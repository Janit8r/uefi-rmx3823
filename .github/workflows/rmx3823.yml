name: rmx3823Pkg

#
# Two jobs for Platforms/Qualcomm/rmx3823Pkg.
#
# lint   - fast structural checks. No submodules, seconds to run.
# build  - the real thing: Mu-Silicium's build_uefi.py, with the UniXNU packages
#          on PACKAGES_PATH.
#
# The build job exists because rmx3823.dsc pulls UniXNUPkg and DarwinBootPkg
# into the firmware volume. Those live outside this checkout, so the engine
# normally supplies them through board.toml [firmware] packages. Here they are
# checked out next to the tree and handed to DeviceBuild.py through
# RMX3823_EXTRA_PACKAGES.
#
# This is a smoke build, not the shipping path. The shipping path is:
#   ./unixnu build firmware --device ../UniXNU-rmx3823 --uefi .
#

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "UEFI build mode"
        type: choice
        options: [RELEASE, DEBUG]
        default: DEBUG
  push:
    branches: [sheng, main]
    paths:
      - "Platforms/Qualcomm/rmx3823Pkg/**"
      - "Resources/Configs/rmx3823.toml"
      - "Resources/Scripts/mkbootimg.py"
      # The build job calls this, so a change here can break the image even
      # though it is not part of the package.
      - "build_uefi.py"
      - ".github/workflows/rmx3823.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The device config parses
        run: |
          python3 - <<'PY'
          import tomllib, sys
          p = "Resources/Configs/rmx3823.toml"
          try:
              cfg = tomllib.load(open(p, "rb"))
          except Exception as e:
              sys.exit(f"{p}: {e}")
          for key in ("boot_shim", "uefi_fd", "boot_image_kernel", "boot_image"):
              if key not in cfg:
                  sys.exit(f"{p}: missing [{key}]")
          for key in ("base", "size"):
              if key not in cfg["uefi_fd"]:
                  sys.exit(f"{p}: missing uefi_fd.{key}")
          print(f"{p}: FD {cfg['uefi_fd']['base']:#x} + {cfg['uefi_fd']['size']:#x}")
          PY

      - name: The firmware base agrees with the memory map
        run: |
          python3 - <<'PY'
          import re, sys, tomllib
          cfg = tomllib.load(open("Resources/Configs/rmx3823.toml", "rb"))["uefi_fd"]
          base, size = cfg["base"], cfg["size"]

          src = open("Platforms/Qualcomm/rmx3823Pkg/Library/MemoryMapLib/MemoryMapLib.c").read()
          # {"UEFI FD", 0xA7100000, 0x00300000, AddMem, ...}
          m = re.search(r'\{"UEFI FD",\s*(0x[0-9A-Fa-f]+),\s*(0x[0-9A-Fa-f]+)', src)
          if not m:
              sys.exit("MemoryMapLib.c: no 'UEFI FD' entry")
          map_base, map_size = int(m.group(1), 16), int(m.group(2), 16)
          if (map_base, map_size) != (base, size):
              sys.exit(
                  f"firmware base mismatch: rmx3823.toml says "
                  f"{base:#x}+{size:#x}, MemoryMapLib.c says {map_base:#x}+{map_size:#x}")
          print(f"UEFI FD {base:#x}+{size:#x} agrees between the config and the memory map")
          PY

      - name: The boot image geometry is explicit
        run: |
          python3 - <<'PY'
          import sys, tomllib
          cfg = tomllib.load(open("Resources/Configs/rmx3823.toml", "rb"))["boot_image"]
          # These are the engine's defaults, but mkbootimg.py - which
          # build_uefi.py uses - has different ones. Leaving any of them out
          # makes the two build paths disagree, so require all of them.
          required = ("header_version", "base", "kernel_offset", "tags_offset", "pagesize")
          missing = [k for k in required if k not in cfg]
          if missing:
              sys.exit(f"[boot_image] must state {', '.join(missing)} explicitly")
          if cfg["pagesize"] not in (2048, 4096):
              sys.exit(f"[boot_image] pagesize {cfg['pagesize']} is not a valid Android boot page size")
          print("boot image:", ", ".join(f"{k}={cfg[k]}" for k in required))
          PY

      - name: Every package-local INF reference exists
        run: |
          set -euo pipefail
          missing=0
          # INF lines in the FDF and its !includes, plus .inf entries in the DSC.
          # Binaries/qrd8550/* are prebuilt blobs from the Device-Binaries
          # submodule, so they are not checked against this tree.
          for ref in $(grep -rhoE '(Binaries/)?(rmx3823Pkg|qrd8550)/[A-Za-z0-9_./-]+\.(inf|dec|dsc|fdf)' \
                         Platforms/Qualcomm/rmx3823Pkg --include='*.inc' --include='*.fdf' --include='*.dsc' \
                       | sort -u); do
            case "$ref" in
              # Prebuilt vendor blobs, not part of this repository.
              Binaries/*) continue ;;
              # Lives in the Silicium-ACPI submodule.
              qrd8550/AcpiTables.inf) continue ;;
            esac
            if [ ! -f "Platforms/Qualcomm/$ref" ]; then
              echo "::error::missing $ref (referenced but not present)"
              missing=1
            fi
          done
          exit "$missing"

      - name: No stale identifiers from the package this was derived from
        run: |
          set -euo pipefail
          # Two references are deliberate: the prebuilt DXE blobs and the
          # SoC-generic ACPI tables both come from the QRD8550 reference design.
          # Comment lines are excluded on purpose - the provenance notes in
          # rmx3823.dsc and MemoryMapLib.c name qrd8550Pkg by design.
          hits=$(grep -rnE 'qrd8550|QRD8550' Platforms/Qualcomm/rmx3823Pkg \
                 | grep -vE 'Binaries/qrd8550/' \
                 | grep -vE 'qrd8550/AcpiTables\.inf' \
                 | grep -vE ':[0-9]+:[[:space:]]*(#|//)' \
                 || true)
          if [ -n "$hits" ]; then
            echo "::error::stale qrd8550 identifiers:"
            echo "$hits"
            exit 1
          fi
          echo "no stale identifiers"

      - name: The UniXNU integration is complete
        run: |
          set -euo pipefail
          dsc=Platforms/Qualcomm/rmx3823Pkg/rmx3823.dsc
          fdf=Platforms/Qualcomm/rmx3823Pkg/rmx3823.fdf
          dxe=Platforms/Qualcomm/rmx3823Pkg/Include/DXE.inc
          fail=0
          need() { # need <file> <token> <description>
            grep -qF "$2" "$1" || { echo "::error::$1 does not reference $3 ($2)"; fail=1; }
          }

          # Built as DSC components and placed in the FDF itself, like shengPkg.
          for inf in UniXNUPkg/Application/UniXNU/UniXNU.inf \
                     UniXNUPkg/Driver/UniXNUDxe/UniXNUDxe.inf ; do
            need "$dsc" "$inf" "the UniXNU application/registrar"
            need "$fdf" "$inf" "the UniXNU application/registrar"
          done

          # Built as DSC components and dispatched from the DXE include.
          for inf in UniXNUPkg/Driver/UniXNURamDiskDxe/UniXNURamDiskDxe.inf \
                     DarwinBootPkg/Driver/DarwinBoot.inf ; do
            need "$dsc" "$inf" "a UniXNU runtime driver"
            need "$dxe" "$inf" "a UniXNU runtime driver"
          done

          # FDF-only modules: EDK II builds them without a [Components] entry,
          # which is how shengPkg ships them too. They are what turns the
          # initrd range into a readable FAT volume.
          for inf in MdeModulePkg/Universal/Disk/DiskIoDxe/DiskIoDxe.inf \
                     MdeModulePkg/Universal/Disk/PartitionDxe/PartitionDxe.inf \
                     FatPkg/EnhancedFatDxe/Fat.inf \
                     MdeModulePkg/Universal/Disk/UnicodeCollation/EnglishDxe/EnglishDxe.inf ; do
            need "$dxe" "$inf" "the payload filesystem stack"
          done

          # Library mappings the shared drivers need.
          need "$dsc" 'UniXNULib|UniXNUPkg/Library/UniXNULib/UniXNULib.inf' 'UniXNULib'
          need "$dsc" 'FdtLib|MdePkg/Library/BaseFdtLib/BaseFdtLib.inf' 'FdtLib'

          exit "$fail"

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI_BUILD: true
      # Pinned to the revision components.toml records for the DarwinBoot driver.
      DARWINBOOT_REV: 3c75734014cdab0acd9541e88057b7606ee7ae08
    steps:
      - name: Check out the firmware tree
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Check out the UniXNU package
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: unixnu
          persist-credentials: false
          fetch-depth: 1

      - name: Check out DarwinBootPkg
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout \
            https://github.com/UniXNU/DarwinBoot.git drivers/DarwinBoot
          git -C drivers/DarwinBoot checkout --detach "$DARWINBOOT_REV"
          test -f drivers/DarwinBoot/DarwinBootPkg/Driver/DarwinBoot.inf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: bash ./setup_env.sh -p apt

      - name: Install Python dependencies
        run: python3 -m pip install --break-system-packages -r pip-requirements.txt

      - name: Show toolchain versions
        run: |
          clang --version | awk 'NR==1'
          aarch64-linux-gnu-gcc --version | awk 'NR==1'
          python3 --version

      - name: Build UEFI
        env:
          # The two directories build_uefi.py cannot know about. DeviceBuild.py
          # appends them to PackagesPath.
          RMX3823_EXTRA_PACKAGES: ${{ github.workspace }}/unixnu/package:${{ github.workspace }}/drivers/DarwinBoot
        run: |
          set -euo pipefail
          MODE="${{ inputs.build_mode }}"
          MODE="${MODE:-DEBUG}"
          python3 ./build_uefi.py -d rmx3823 -r "$MODE" -c -m 0

      - name: Check the firmware volume
        run: |
          set -euo pipefail
          fd=$(find Build/rmx3823Pkg -name SILICIUM_UEFI.fd | head -1)
          test -n "$fd"
          size=$(stat -c %s "$fd")
          echo "firmware volume: $fd ($size bytes)"
          # [uefi_fd] size in Resources/Configs/rmx3823.toml.
          test "$size" = "3145728" || { echo "::error::expected 3145728 bytes"; exit 1; }

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out
          cp -v Mu-* out/ 2>/dev/null || true
          find Build/rmx3823Pkg -name "*.fd" -exec cp -v {} out/ \; 2>/dev/null || true

      - name: Upload images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rmx3823-uefi
          path: out/
          if-no-files-found: warn
          compression-level: 9
